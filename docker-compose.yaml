services:
  app:
    image: ${APP_IMAGE:-ghcr.io/usagi-org/ai-goofish:latest}
    container_name: ai-goofish-monitor-app
    pull_policy: ${APP_PULL_POLICY:-missing}
    init: true
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
      SERVER_PORT: 8000
      RUNNING_IN_DOCKER: "true"
      RUN_HEADLESS: "true"
      USE_SYSTEM_CHROME: "false"
      LOGIN_IS_EDGE: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./prompts:/app/prompts
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
